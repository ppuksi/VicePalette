name: Release scheduled entries

on:
  # Every 15 minutes, offset from the inbox worker so they don't collide.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-scheduled
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark due entries published
        run: node scripts/release-scheduled.mjs

      - name: Check for changes
        id: check
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing scheduled to release."
          fi

      # GITHUB_TOKEN commits don't re-trigger workflows, so dispatch the
      # deploy explicitly after committing the published markers.
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "vicepalette-bot"
          git config user.email "vicepalette-bot@users.noreply.github.com"
          git add -A
          git commit -m "release: scheduled gallery entries"
          git push

      - name: Trigger deploy
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
